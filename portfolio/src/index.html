<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
</head>

<body>

  <header class="header">
    <div class="header__inner">
      <a href="index.html" class="header__logo">
        <img class="header__logo-img" src="./assets/icons/logo.svg" alt="Logo">
      </a>
      <nav class="header__nav">
        <ul class="header__list">
          <li class="header__item">
            <a href="#about" class="header__link">About me</a>
          </li>
          <li class="header__item">
            <a href="#portfolio" class="header__link">Portfolio</a>
          </li>
          <li class="header__item">
            <a href="#price" class="header__link">Price</a>
          </li>
          <li class="header__item">
            <a href="#faq" class="header__link">FAQ</a>
          </li>
          <li class="header__item">
            <a href="#contacts" class="header__link">Contacts</a>
          </li>
        </ul>
      </nav>
      <button class="header__burger">
        <div class="header__burger-inner">
          <span class="header__burger-line">&nbsp;</span>
          <span class="header__burger-line">&nbsp;</span>
        </div>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero__inner">
        <div class="hero__best">
          <div class="hero__best-text">2025</div>
          <div class="hero__best-line">&nbsp;</div>
          <p class="hero__best-text">Best Photographer by MAX</p>
        </div>
        <div class="hero__info">
          <div class="hero__info-top">
            <div class="hero__info-item">
              <div class="hero__info-item-amount">+ 487</div>
              <p class="hero__info-item-text">Photo sessions</p>
            </div>
            <div class="hero__info-item">
              <div class="hero__info-item-amount">+ 356</div>
              <p class="hero__info-item-text">Satisfied clients</p>
            </div>
          </div>
          <h1 class="hero__info-title">Professional Photographer</h1>
          <p class="hero__info-descr">Capture the moment. Tell your story.</p>
          <a class="hero__info-scroll" href="#about">
            Scroll down
            <svg class="hero__info-scroll-svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M12 5V19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <path d="M19 12L12 19L5 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </a>
        </div>
        <div class="hero__images">
          <div class="hero__images-item">
            <picture>
              <source srcset="/assets/images/converted/hero-1.avif" type="image/avif">
              <source srcset="/assets/images/converted/hero-1.webp" type="image/webp">
              <img class="hero__images-item-image" src="/assets/images/hero-1.png" width="220" height="220" alt="Image">
            </picture>
          </div>
          <div class="hero__images-item">
            <picture>
              <source srcset="./assets/images/converted/hero-2.avif" type="image/avif">
              <source srcset="./assets/images/converted/hero-2.webp" type="image/webp">
              <img class="hero__images-item-image" src="./assets/images/hero-2.png" width="280" height="374"
                alt="Image">
            </picture>
            <p class="hero__images-item-descr">
              Hi! I’m Vera, a photographer. For me, photography is more than just an image.
            </p>
          </div>
        </div>
      </div>
    </section>
  </main>



  <script type="module" src="./scripts/main.js"></script>
</body>

</html>
